available-link-data:
  - title: "Why are Earth observation data important?"
    description: "For decades, airborne and spaceborne sensors have been acquiring data across Wales, Switzerland, Australia and many other regions in varying modes and across a range of spatial resolutions and temporal frequencies. These sections provide information on and access to a range of data, much of which is in an analysis ready data (ARD) format.

    
    These data include freely accessible radar and optical data acquired by the Sentinel-1 and 2 respectively, which are provided in both near real time and as historical archives and can be downloaded at no cost."
    country/region-header: ""
    link-header: ""
    data_table:
      - country_region: ""
        access_link: ""
      - country_region: ""
        access_link: ""
      - country_region: ""
        access_link: ""

  - title: "How can I download satellite data in an analysis ready data (ARD) format?"
    description: "Direct links to the ARD for each country or region are listed under <a href=\"/tools/for-developers/#browse-by-country\">Browse by Country</a> above."
  - title: "How can I download the Living Earth products, such as land cover, habitat and change maps and the environmental descriptors?"
    description: "The products generated through Living Earth can be downloaded directly from the <a href=\"/tools/interactive-map\">interactive map</a>."

  - title: "Can I access the data through your country's data cube?"
    description: "If you do not want to download the data but instead use within the Open Data Cube for your country or region to access the ARD and derived products. You will need to request a login on each occasion. All data and derived products can be downloaded whilst your own datasets can be uploaded and integrated into your workflows. Login links for each country are listed under <a href=\"/tools/for-developers/#browse-by-country\">Browse by Country</a> above."
  - title: "How do I get access to the ground observation records submitted to Earthtrack?"
    description: "Earthtrack data are available for viewing on the Earthtrack mobile application immediately following submission.

    
    Submitted data are also transferred immediately to Natural Apptitude's Coreo database, whereupon they are reviewed internally for record and image quality and content, and released within a day of submission to the Earthtrack Geoportal where they are available for download.
    
    
    All points can be downloaded from the Geoportal, but subsets can be selected by defining or drawing a region of interest. The direct access links are below:"
    country/region-header: "Dataset"
    link-header: "Direct link"
    data_table:
      - country_region: "Habitat"
        access_link: "https://earthtrack.aber.ac.uk/campaign/habitat_world.html"
        newtab: true
      - country_region: "Change"
        access_link: "https://earthtrack.aber.ac.uk/campaign/change_world.html"
        newtab: true
      - country_region: "Fire"
        access_link: "https://earthtrack.aber.ac.uk/campaign/fire_world.html"
        newtab: true

bottom-box:
  title: "Can the Earthtrack data be accessed via a web-service?"
  description_1: "All Earthtrack points can be accessed by connecting to the Web Feature Service on your software through the URL"
  url: "https://earthtrack.aber.ac.uk/services/wfs"
  newtab: true

